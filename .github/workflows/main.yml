name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Generate keystore
      run: |
        mkdir -p android/app
        keytool -genkey -v -keystore android/app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias release -keypass android -storepass android -dname "CN=Release,O=Android,C=US"

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m" --no-daemon

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
